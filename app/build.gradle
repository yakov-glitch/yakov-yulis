plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.homeclockreminder'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.homeclockreminder'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.4.0'
}
